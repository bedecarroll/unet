name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-upload:
    name: Build and Upload
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: unet-linux-x86_64.tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: unet-linux-x86_64-musl.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            name: unet-macos-x86_64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            name: unet-macos-aarch64.tar.gz

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.96.0"
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --target "$TARGET" --bin unet-server --bin unet-cli

      - name: Create archive
        env:
          ARCHIVE_NAME: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir release
          cp "target/$TARGET/release/unet-server" release/
          cp "target/$TARGET/release/unet-cli" release/
          cp README.md release/
          cp -r docs/src release/docs
          tar --create --gzip --file="$ARCHIVE_NAME" --directory=release .

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build-and-upload
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/* --title "Release $RELEASE_TAG" --verify-tag
